# Keeps the Render free-tier web service awake by pinging /api/health
# every 5 minutes (Render spins down free services after 15 idle minutes).
#
# Notes:
# - Scheduled workflows only run on the default branch.
# - GitHub Actions cron can be delayed by a few minutes; an occasional miss
#   is fine since the idle window is 15 minutes.
# - GitHub disables schedules automatically after 60 days with no repo
#   activity; any push (or re-enabling the workflow) restarts them.
# - For a more reliable pinger, a free uptime monitor (e.g. UptimeRobot)
#   hitting the same URL is a drop-in alternative.

name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    concurrency:
      group: keep-alive
      cancel-in-progress: false
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' -m 30 \
            https://trafic-bdut.onrender.com/api/health)
          cat /tmp/health.json
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned HTTP $code"
          fi
